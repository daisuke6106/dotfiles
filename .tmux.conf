# マウス操作(ホイールスクロール、ペイン選択・リサイズなど)を有効化
set -g mouse on

# コピーモードのキー操作をvi風にする
setw -g mode-keys vi

# PageUp でコピーモードに入り、そのままスクロールできるようにする
bind-key -n PageUp copy-mode -u

# prefix + Ctrl+→ / Ctrl+← で画面を縦(左右)に分割する
bind-key C-Right split-window -h
bind-key C-Left split-window -h

# prefix + Ctrl+↓ / Ctrl+↑ で画面を横(上下)に分割する
bind-key C-Down split-window -v
bind-key C-Up split-window -v
